<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #05070d; font-family: system-ui, sans-serif; }
    #map { position: absolute; inset: 0; }
    #settings { position: absolute; top: 12px; left: 12px; z-index: 1; }
    #readout { position: absolute; bottom: 12px; left: 12px; z-index: 1; }
    .corner-toggle {
      width: 36px; height: 36px; border: 0; border-radius: 8px; cursor: pointer;
      background: rgba(12, 16, 28, 0.85); color: #e6e9f2; font-size: 20px; line-height: 1;
    }
    .corner-toggle:hover, .corner-toggle[aria-expanded="true"] { background: rgba(32, 40, 60, 0.95); }
    [hidden] { display: none !important; }
    #panel {
      margin-top: 6px;
      background: rgba(12, 16, 28, 0.85); color: #e6e9f2;
      padding: 12px 14px; border-radius: 8px; font-size: 13px;
      max-width: calc(100vw - 56px); box-sizing: border-box;
    }
    #panel h1 { font-size: 15px; margin: 0 0 8px; }
    #panel label { display: block; margin: 4px 0; cursor: pointer; }
    #panel select { width: 100%; margin-bottom: 6px; }
    .maplibregl-popup-content { font-size: 13px; }
    .maplibregl-ctrl.maplibregl-ctrl-attrib { background: rgba(12, 16, 28, 0.85); color: #8c93a8; }
    .maplibregl-ctrl-attrib a { color: #c9d1e3; }
    #coords {
      margin-bottom: 6px;
      background: rgba(12, 16, 28, 0.85); color: #e6e9f2;
      padding: 6px 10px; border-radius: 6px;
      font: 12px ui-monospace, Menlo, monospace; white-space: pre;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="settings">
  <button id="settings-toggle" class="corner-toggle" type="button" aria-label="Settings" aria-expanded="false" aria-controls="panel" title="Settings">⚙</button>
  <div id="panel" hidden>
    <h1>Earth</h1>
    <select id="projection" aria-label="Projection">
      <option value="globe" selected>Globe</option>
      <option value="mercator">Mercator</option>
    </select>
    <select id="coloring" aria-label="Land color">
      <option value="elevation" selected>Elevation</option>
      <option value="country">Country</option>
    </select>
    <label><input type="checkbox" id="borders" checked> Borders</label>
    <label><input type="checkbox" id="cities" checked> Cities</label>
    <label><input type="checkbox" id="spin"> Auto-rotate</label>
  </div>
  </div>
  <div id="readout">
    <div id="coords" hidden></div>
    <button id="readout-toggle" class="corner-toggle" type="button" aria-label="Map position and scale" aria-expanded="false" aria-controls="coords" title="Map position and scale">📐</button>
  </div>

  <script>
    // Corner boxes hidden behind a button: the settings panel (⚙, top left) and the
    // position readout (📐, bottom left). Open/closed is remembered per browser; Escape closes.
    function cornerToggle(buttonId, boxId, storageKey) {
      const button = document.getElementById(buttonId);
      const box = document.getElementById(boxId);
      const setOpen = open => {
        box.hidden = !open;
        button.setAttribute('aria-expanded', String(open));
        try { localStorage.setItem(storageKey, open ? '1' : '0'); } catch {}
      };
      button.addEventListener('click', () => setOpen(box.hidden));
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !box.hidden) setOpen(false);
      });
      try { if (localStorage.getItem(storageKey) === '1') setOpen(true); } catch {}
    }
    cornerToggle('settings-toggle', 'panel', 'settingsOpen');
    cornerToggle('readout-toggle', 'coords', 'readoutOpen');

    // Natural Earth's MAPCOLOR7 gives each country one of 7 colors so neighbors differ
    // Earthy palette for coloring by country: muted greens, tans and clays at similar
    // brightness. Natural Earth's MAPCOLOR7 gives neighbors different numbers.
    const COUNTRY_COLOR = ['match', ['get', 'MAPCOLOR7'],
      1, '#8a9a6b', // sage
      2, '#b3a173', // khaki
      3, '#6f8257', // olive
      4, '#bfa283', // tan
      5, '#97866a', // taupe
      6, '#a3ad84', // moss
      7, '#a9826a', // clay
      '#999'];

    // Land colored by elevation, like an atlas: green lowlands, tan uplands, brown
    // mountains, pale highest peaks. LOWLAND is 0-200 m; each band covers its height and up.
    const LOWLAND = '#9fb07f';
    const ELEVATION_COLOR = ['step', ['get', 'elevation'], LOWLAND,
      200,  '#b5bd88',
      500,  '#cbc893',
      1000, '#d6c08c',
      1500, '#cdaa7c',
      2000, '#bf9670',
      3000, '#a98066',
      4000, '#b9aaa0',
      5000, '#e9e4dd'];

    // Which cities to show, by Natural Earth's scalerank (0 = most important).
    // Each tier is [apparent zoom, highest rank shown]; more cities appear as you zoom in.
    const CITY_TIERS = [
      [0,   1],         // zoomed out: major cities only
      [2.5, 2],         // e.g. Boston, Seattle, Dallas
      [3.5, 3],
      [4.5, 4],
      [5.5, 6],         // e.g. Columbus, Ohio
      [6.5, 7],
      [7.5, 8],
      [8.5, Infinity],  // zoomed in: all cities
    ];

    // The tiers use "apparent zoom" (how big the planet looks), not MapLibre's zoom number.
    // On the globe, MapLibre lowers the zoom number toward the poles to keep the planet the
    // same size, so tiers based on it would drop cities just from panning north or south.
    // (A ['zoom'] filter would also only change at whole zoom levels.)
    function apparentZoom() {
      if (map.getProjection()?.type === 'mercator') return map.getZoom();
      const lat = Math.min(85, Math.abs(map.getCenter().lat));
      return map.getZoom() - Math.log2(Math.cos(lat * Math.PI / 180));
    }

    // Dots and labels are one layer, so every dot has a name
    const cityFilter = maxRank => ['<=', ['get', 'scalerank'], maxRank === Infinity ? 99 : maxRank];
    let shownMaxRank = 1;
    function updateCityTier() {
      const z = apparentZoom();
      const maxRank = CITY_TIERS.filter(([minZoom]) => z >= minZoom).at(-1)[1];
      if (maxRank !== shownMaxRank) {
        shownMaxRank = maxRank;
        map.setFilter('cities', cityFilter(maxRank));
      }
    }

    // Grid lines every 10°, built in code instead of loaded from a file.
    // Points every 1° so the lines curve smoothly around the globe.
    function graticule(step = 10) {
      const lines = [];
      for (let lat = -80; lat <= 80; lat += step) {          // lines of latitude
        const coords = [];
        for (let lng = -180; lng <= 180; lng += 1) coords.push([lng, lat]);
        lines.push(coords);
      }
      for (let lng = -180; lng < 180; lng += step) {         // lines of longitude
        const coords = [];
        for (let lat = -90; lat <= 90; lat += 1) coords.push([lng, lat]);
        lines.push(coords);
      }
      return {
        type: 'FeatureCollection',
        features: lines.map(coordinates => ({
          type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates },
        })),
      };
    }

    // Zoom so the whole globe fits the window (globe diameter ≈ 512·2^zoom / π px)
    const fitZoom = Math.log2(0.75 * Math.min(innerWidth, innerHeight) * Math.PI / 512);

    // Credit shown in the bottom-right attribution box (MapLibre lists it once even though several sources share it)
    const NE = 'Data: <a href="https://www.naturalearthdata.com/">Natural Earth</a>';
    const ETOPO = '<a href="https://www.ncei.noaa.gov/products/etopo-global-relief-model">NOAA ETOPO 2022</a>';

    const map = new maplibregl.Map({
      container: 'map',
      attributionControl: {
        compact: false, // always show credits, not just an ⓘ button
        customAttribution: '<a href="https://maplibre.org/">MapLibre</a>',
      },
      center: [-40, 30],
      zoom: fitZoom,
      pitch: 0,
      maxPitch: 75,
      style: {
        version: 8,
        projection: { type: 'globe' },
        glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
        sky: {
          'sky-color': '#05070d',
          'horizon-color': '#1b2a4a',
          'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 6, 0],
        },
        sources: {
          countries: { type: 'geojson', data: 'data/ne_50m_admin_0_countries.geojson', attribution: NE },
          lakes:     { type: 'geojson', data: 'data/ne_50m_lakes.geojson', attribution: NE },
          rivers:    { type: 'geojson', data: 'data/ne_50m_rivers_lake_centerlines.geojson', attribution: NE },
          graticule: { type: 'geojson', data: graticule() },
          // Land elevation bands traced from NOAA ETOPO 2022 (5 arc-minute grid). Each feature
          // covers everywhere at least `elevation` meters high; its outline is that contour line.
          elevation: { type: 'geojson', data: 'data/etopo_2022_elevation_bands.geojson', attribution: ETOPO },
          places:    { type: 'geojson', data: 'data/ne_10m_populated_places_simple.geojson', attribution: NE },
        },
        layers: [
          { id: 'ocean', type: 'background', paint: { 'background-color': '#0d2236' } },
          { id: 'graticule', type: 'line', source: 'graticule',
            paint: { 'line-color': '#24476b', 'line-width': 0.6 } },
          { id: 'land', type: 'fill', source: 'countries',
            paint: { 'fill-color': LOWLAND } },
          // Drawn low to high, so each spot ends up colored by its highest band
          { id: 'elevation', type: 'fill', source: 'elevation',
            layout: { 'fill-sort-key': ['get', 'elevation'] },
            paint: { 'fill-color': ELEVATION_COLOR } },
          { id: 'lakes', type: 'fill', source: 'lakes', paint: { 'fill-color': '#2f5f86' } },
          // Rivers: bigger rivers (lower scalerank) are wider, and all widen as you zoom in
          { id: 'rivers', type: 'line', source: 'rivers',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: {
              'line-color': '#3d76a3',
              'line-width': ['interpolate', ['linear'], ['zoom'],
                1, ['interpolate', ['linear'], ['get', 'scalerank'], 1, 0.8, 6, 0.2],
                6, ['interpolate', ['linear'], ['get', 'scalerank'], 1, 3, 6, 1]],
            } },
          { id: 'borders', type: 'line', source: 'countries',
            paint: { 'line-color': '#3b3026', 'line-width': 0.7, 'line-opacity': 0.6 } },
          // Elevation contours. Zoomed out, only every 1,000 m; zoomed in, also 200, 500 and 1,500 m.
          // The 1,000 m lines are drawn heavier so the big steps stand out.
          { id: 'contours', type: 'line', source: 'elevation',
            filter: ['step', ['zoom'], ['==', ['%', ['get', 'elevation'], 1000], 0], 3, true],
            layout: { 'line-join': 'round' },
            paint: {
              'line-color': '#4a3a28',
              'line-opacity': 0.3,
              'line-width': ['case', ['==', ['%', ['get', 'elevation'], 1000], 0], 0.9, 0.4],
            } },
          // Dot and name are one symbol, so they always appear or hide together.
          // When labels would collide, the name tries other sides of the dot first;
          // if there's still no room, the less important city (higher scalerank) is hidden.
          { id: 'cities', type: 'symbol', source: 'places',
            filter: cityFilter(shownMaxRank),
            layout: {
              'symbol-sort-key': ['get', 'scalerank'],
              'icon-image': 'city-dot',
              'icon-size': ['interpolate', ['linear'], ['zoom'], 1, 0.45, 5, 1],
              'text-field': ['get', 'name'],
              'text-font': ['Open Sans Semibold'],
              'text-size': 11,
              'text-variable-anchor': ['top', 'bottom', 'right', 'left'],
              'text-radial-offset': 0.6,
              'text-justify': 'auto',
            },
            paint: { 'text-color': '#fff', 'text-halo-color': '#000', 'text-halo-width': 1.2 } },
        ],
      },
    });

    // The city dot: a white circle with a dark outline, drawn at 2x for sharp edges
    map.on('styleimagemissing', e => {
      if (e.id !== 'city-dot') return;
      const size = 16, ctx = Object.assign(document.createElement('canvas'), { width: size, height: size }).getContext('2d');
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 1.5, 0, 2 * Math.PI);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = '#000';
      ctx.stroke();
      map.addImage('city-dot', ctx.getImageData(0, 0, size, size), { pixelRatio: 2 });
    });

    // Keep the canvas sized to its container (e.g. if the page loads hidden)
    new ResizeObserver(() => map.resize()).observe(document.getElementById('map'));

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

    // Arrow-key panning. MapLibre's built-in handler pins the zoom number, which on the
    // globe makes the planet grow as you drift toward the poles. Without a zoom, easeTo
    // keeps the planet the same size on screen, like dragging with the mouse does.
    // Held keys are tracked so two at once (e.g. left + up) pan diagonally.
    // Shift + arrows (rotate and tilt) still go to MapLibre.
    const PAN_SPEED = 400; // pixels per second
    const ARROWS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
    const held = new Set();
    let lastFrame = null, running = false;

    function panFrame(now) {
      if (!held.size) { lastFrame = null; running = false; return; }
      const dt = lastFrame === null ? 1 / 60 : Math.min((now - lastFrame) / 1000, 0.1);
      lastFrame = now;
      let dx = 0, dy = 0;
      for (const k of held) { dx += ARROWS[k][0]; dy += ARROWS[k][1]; }
      const len = Math.hypot(dx, dy);
      if (len) {
        const step = PAN_SPEED * dt / len; // same speed on diagonals
        map.easeTo({ center: map.getCenter(), offset: [-dx * step, -dy * step], duration: 0 });
      }
      requestAnimationFrame(panFrame);
    }

    const mapEl = document.getElementById('map');
    mapEl.addEventListener('keydown', e => {
      if (!ARROWS[e.key] || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
      e.preventDefault();
      e.stopPropagation(); // capture phase, so MapLibre never sees it
      held.add(e.key);
      if (!running) { running = true; requestAnimationFrame(panFrame); }
    }, true);
    mapEl.addEventListener('keyup', e => {
      if (ARROWS[e.key]) held.delete(e.key);
    }, true);
    window.addEventListener('blur', () => held.clear());

    // Color by elevation (bands over a lowland base) or by country (bands hidden)
    document.getElementById('coloring').addEventListener('change', e => {
      const byCountry = e.target.value === 'country';
      map.setPaintProperty('land', 'fill-color', byCountry ? COUNTRY_COLOR : LOWLAND);
      map.setLayoutProperty('elevation', 'visibility', byCountry ? 'none' : 'visible');
    });

    document.getElementById('projection').addEventListener('change', e => {
      map.setProjection({ type: e.target.value });
      updateCityTier();
    });

    document.getElementById('cities').addEventListener('change', e => {
      const v = e.target.checked ? 'visible' : 'none';
      map.setLayoutProperty('cities', 'visibility', v);
    });

    document.getElementById('borders').addEventListener('change', e => {
      map.setLayoutProperty('borders', 'visibility', e.target.checked ? 'visible' : 'none');
    });

    // Ground distance covered by one screen pixel at the center of the map. On the
    // globe this changes with latitude even when zoom doesn't.
    function kmPerPixel() {
      const p = map.project(map.getCenter());
      const a = map.unproject([p.x - 5, p.y]);
      const b = map.unproject([p.x + 5, p.y]);
      return a.distanceTo(b) / 10 / 1000;
    }

    // Show the camera: center as [longitude, latitude], zoom, rotation, tilt and scale
    const coords = document.getElementById('coords');
    function showCenter() {
      const c = map.getCenter().wrap();
      coords.textContent =
        `center:  [${c.lng.toFixed(2)}, ${c.lat.toFixed(2)}]\n` +
        `zoom:    ${map.getZoom().toFixed(2)}\n` +
        `bearing: ${map.getBearing().toFixed(1)}°\n` +
        `pitch:   ${map.getPitch().toFixed(1)}°\n` +
        `scale:   1 px = ${kmPerPixel().toPrecision(3)} km`;
    }
    map.on('move', showCenter);
    map.on('move', updateCityTier);
    map.on('load', updateCityTier);
    showCenter();

    // Hover popup
    const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false });
    map.on('mousemove', 'land', e => {
      const p = e.features[0].properties;
      map.getCanvas().style.cursor = 'pointer';
      popup.setLngLat(e.lngLat).setHTML(
        `<strong>${p.NAME}</strong><br>` +
        `<span style="color:#666">${p.CONTINENT}</span>`
      ).addTo(map);
    });
    map.on('mouseleave', 'land', () => {
      map.getCanvas().style.cursor = '';
      popup.remove();
    });

    // Auto-rotate, paused while the user interacts. Besides spinning east, the view
    // drifts north and south between ±MAX_LAT, so over a few turns every part of the
    // globe comes around, Arctic and Antarctica included.
    const spin = document.getElementById('spin');
    const LNG_STEP = 6;    // degrees per second: one turn per minute
    const LAT_STEP = 1.75; // degrees per second: one north-south cycle per ~2.5 turns
    const MAX_LAT = 65;    // centered here, the pole itself is in view
    let latDir = -1;       // start by heading south
    let interacting = false;
    function rotate() {
      if (spin.checked && !interacting && !held.size && map.getZoom() < 4) {
        const c = map.getCenter();
        if (c.lat >= MAX_LAT) latDir = -1;
        if (c.lat <= -MAX_LAT) latDir = 1;
        map.easeTo({ center: [c.lng + LNG_STEP, c.lat + latDir * LAT_STEP], duration: 1000, easing: t => t });
      }
    }
    map.on('mousedown', () => { interacting = true; });
    map.on('touchstart', () => { interacting = true; });
    map.on('mouseup', () => { interacting = false; rotate(); });
    map.on('touchend', () => { interacting = false; rotate(); });
    map.on('moveend', rotate);
    spin.addEventListener('change', rotate);
    map.on('load', rotate);
  </script>
</body>
</html>
